name: Google Play Console Release & Staged Rollout

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - production
      user_fraction:
        description: 'Staged Rollout Fraction for Production (0.10, 0.25, 0.50, 1.0)'
        required: false
        default: '0.10'

jobs:
  play-console-deploy:
    name: Publish App Bundle to Google Play Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Release Track Configuration
        run: |
          echo "Selected Track: ${{ github.event.inputs.track }}"
          echo "User Rollout Fraction: ${{ github.event.inputs.user_fraction }}"
          cat play-console/track-config.json

      - name: Deploy to Google Play Console
        if: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.relifex.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          userFraction: ${{ github.event.inputs.track == 'production' && github.event.inputs.user_fraction || '1.0' }}
          status: ${{ github.event.inputs.track == 'production' && github.event.inputs.user_fraction != '1.0' && 'inProgress' || 'completed' }}
          whatsNewDirectory: play-console/release-notes
